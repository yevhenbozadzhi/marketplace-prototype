services:
  postgres:
    image: postgres:16-alpine
    container_name: n5deal_marketplace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: n5deal
      POSTGRES_PASSWORD: n5deal
      POSTGRES_DB: n5deal_marketplace
    ports:
      - "5432:5432"
    volumes:
      - n5deal_postgres_data:/var/lib/postgresql/data

volumes:
  n5deal_postgres_data:
