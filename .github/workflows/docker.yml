name: Deploy on Commit

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || endsWith(github.event.head_commit.message, 'deploy')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/n5deal-marketplace:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/n5deal-marketplace:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
